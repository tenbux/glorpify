<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0d1117"/>

  <!-- ears: short, rounded tip; base points sit inside the head circle -->
  <path d="M20,30 L13.6,16.4 Q12,13 15.2,15.6 L28,26 Z" fill="#39d353"/>
  <path d="M44,30 L50.4,16.4 Q52,13 48.8,15.6 L36,26 Z" fill="#39d353"/>
  <path d="M20,27 L16.5,19.4 Q15.6,17.5 17.4,18.9 L24.4,24.7 Z" fill="#8be89c"/>
  <path d="M44,27 L47.5,19.4 Q48.4,17.5 46.6,18.9 L39.6,24.7 Z" fill="#8be89c"/>

  <!-- antennae, poking up between the ears -->
  <path d="M27,22 Q23,13 23,9" fill="none" stroke="#39d353" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M37,22 Q41,13 41,9" fill="none" stroke="#39d353" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="23" cy="9" r="3" fill="#39d353"/>
  <circle cx="41" cy="9" r="3" fill="#39d353"/>

  <!-- head -->
  <circle cx="32" cy="38" r="18" fill="#39d353"/>

  <!-- alien eyes -->
  <ellipse cx="24" cy="37" rx="5.5" ry="7" fill="#0f190f"/>
  <ellipse cx="40" cy="37" rx="5.5" ry="7" fill="#0f190f"/>
  <circle cx="22.3" cy="33.5" r="1.7" fill="#8be89c"/>
  <circle cx="38.3" cy="33.5" r="1.7" fill="#8be89c"/>

  <!-- nose -->
  <polygon points="29,46 35,46 32,50" fill="#0f190f"/>
</svg>
